<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="options.css" />
    <title>AI Tools Hub Clipper · 设置</title>
  </head>
  <body>
    <main class="card">
      <header class="head">
        <img src="icons/icon48.png" alt="" width="28" height="28" />
        <h1>AI Tools Hub Clipper 设置</h1>
      </header>

      <label class="field">
        <span class="label">服务器地址</span>
        <input id="serverUrl" type="text" placeholder="http://127.0.0.1:7317" />
        <small class="hint">本地调试填 http://127.0.0.1:7317；上线后填域名，例如 https://tools-hub.xuyh.site</small>
      </label>

      <label class="field">
        <span class="label">API Token</span>
        <input id="apiToken" type="password" placeholder="与服务器 .env 的 EXTENSION_API_TOKEN 一致" />
        <small class="hint">服务器未设置 token 时可留空（仅本地）。公网部署必须填写。</small>
      </label>

      <label class="field">
        <span class="label">主题</span>
        <select id="theme"></select>
        <small class="hint">「自动跟随工作台」会读取你已打开的工作台页面当前主题；读不到时用上次同步的主题或默认。</small>
      </label>

      <div class="actions">
        <button id="test" class="ghost-btn" type="button">测试连接</button>
        <button id="save" class="primary-btn" type="button">保存设置</button>
      </div>

      <div id="message" class="message" hidden></div>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
